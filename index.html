<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RadsiOS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
      @font-face {
        font-family: "Pizza Tower";
        src: url("assets/Pizza Tower.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .paint-text {
        text-shadow: 0.5px 0.5px 0 #000;
      }

      body {
        font-family:
          "Pizza Tower",
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol";
      }

      .window #app-content {
        color: inherit;
      }
    </style>
  </head>

  <body class="overflow-hidden bg-slate-900 text-white">
    <div id="wallpaper"></div>

    <div id="desktop"></div>

    <div id="taskbar"></div>

    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
